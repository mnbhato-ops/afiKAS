name: SNS Auto Publisher Workflow

on:
  schedule:
    # 毎日 日本時間 朝7:00 (22:00 UTC) と 夜19:00 (10:00 UTC) に実行
    - cron: '0 22 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-publisher:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright requests-oauthlib
        playwright install chromium
        playwright install-deps

    - name: Run Publisher Engine
      env:
        GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
        AMAZON_ID: ${{ secrets.AMAZON_ID }}
        X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
        X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
        X_USER_TOKEN: ${{ secrets.X_USER_TOKEN }}
        X_USER_SECRET: ${{ secrets.X_USER_SECRET }}
      run: |
        python app.py

    - name: Save Product History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history.log || true
        git commit -m "Update history log [skip ci]" || true
        git push || true
