name: Threads Amazon Affiliate Auto Post

on:
  schedule:
    # 毎日 UTC 03:00 (JST 12:00) および UTC 12:00 (JST 21:00) に自動実行
    - cron: '0 3,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

           - name: Run Auto-Post Script
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          AMAZON_ID: ${{ secrets.AMAZON_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python main.py

      - name: Commit and push updated posted_asins.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_asins.json
          git diff --staged --quiet || (git commit -m "chore: update posted_asins.json [skip ci]" && git push)
